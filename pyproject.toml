[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpack"
version = "0.1.0"
description = "Version-bound visible kit inspection with bounded corrective actions"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
proofpack = "proofpack.runtime.host:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]
addopts = "-ra --strict-markers"
markers = ["integration: local integration boundary", "opencv: actual OpenCV runtime"]
